<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Email List — FEDPromptly</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.join-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px}.join-card{width:min(100%,440px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.join-card h1{font-size:2.4rem;line-height:.95;letter-spacing:-.07em;margin:12px 0}.join-card p{color:var(--muted)}.join-card label{display:block;color:var(--muted);font:12px 'DM Mono';margin:17px 0 7px}.join-card input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#111017;color:var(--paper);font:15px 'Space Grotesk'}.join-card input:focus{outline:2px solid var(--violet);border-color:var(--violet)}.join-card button{width:100%;margin-top:20px;cursor:pointer}.join-card .switch{text-align:center;margin-top:15px}.join-card .switch button{width:auto;margin:0;background:none;border:0;color:var(--mint);font:inherit}.msg{min-height:22px;margin-top:14px;font-size:13px}.msg.error{color:#ff9b9b}.msg.success{color:var(--mint)}.logged{display:none;text-align:center}.avatar{width:68px;height:68px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--coral);color:var(--ink);font-size:28px;font-weight:700}</style></head><body><main class="join-wrap"><section class="join-card"><div id="auth"><div class="eyebrow">FEDPROMPTLY / EMAIL LIST</div><h1 id="title">Join the loop.</h1><p id="sub">Get project notes and updates from FEDPromptly.</p><form id="form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">PASSWORD</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="At least 6 characters" required><button class="button primary" id="submit" type="submit">Join email list ↗</button><div class="msg" id="msg" role="status"></div></form><div class="switch"><span id="switchText">Already joined?</span> <button id="switch" type="button">Sign in</button></div></div><div class="logged" id="logged"><div class="avatar" id="avatar">F</div><h1>You're in.</h1><p id="loggedEmail"></p><p>Thanks for joining the FEDPromptly email list.</p><button class="button ghost" id="logout" type="button">Sign out</button></div><p><a href="index.html">← Back to Muse Shared Spaces</a></p></section></main><script>const sb=supabase.createClient('https://qyuczfpgydgqywgthgrz.supabase.co','sb_publishable_2NLEuDREplLS9DgUXeA8Tw_f8MJOhCq');let signUp=true;const $=id=>document.getElementById(id),msg=(t,c='')=>{$('msg').textContent=t;$('msg').className='msg '+c};function mode(){signUp=!signUp;$('title').textContent=signUp?'Join the loop.':'Welcome back.';$('sub').textContent=signUp?'Get project notes and updates from FEDPromptly.':'Sign in to continue.';$('submit').textContent=signUp?'Join email list ↗':'Sign in ↗';$('switchText').textContent=signUp?'Already joined?':'Need an account?';$('switch').textContent=signUp?'Sign in':'Join email list';msg('')}$('switch').onclick=mode;$('form').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;$('submit').disabled=true;msg('Working…');try{const result=signUp?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href}}):await sb.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(signUp&&!result.data.session){msg('Check your inbox to confirm your email.','success')}else{show(result.data.user)}}catch(err){msg(err.message||'Something went wrong.','error')}finally{$('submit').disabled=false}};function show(user){$('auth').style.display='none';$('logged').style.display='block';$('avatar').textContent=(user.email||'F')[0].toUpperCase();$('loggedEmail').textContent=user.email||''}$('logout').onclick=async()=>{await sb.auth.signOut();$('logged').style.display='none';$('auth').style.display='block'};sb.auth.getSession().then(({data})=>{if(data.session)show(data.session.user)});</script></body></html>
